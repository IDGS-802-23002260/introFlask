{% extends "layout.html" %}
 
{% block content %}
 
<form action="/operasBas" method="post">
    <div class="mb-3">
        <label for="n1" class="form-label">Número 1</label>
        <input type="text" class="form-control" name="n1" id="n1">
    </div>

    <div class="mb-3">
        <label for="n2" class="form-label">Número 2</label>
        <input type="text" class="form-control" name="n2" id="n2">
    </div>

    <div class="mb-3">
        <label class="form-label">Operación</label>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="operacion" value="suma" checked>
            <label class="form-check-label">Suma</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="operacion" value="resta">
            <label class="form-check-label">Resta</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="operacion" value="multiplicacion">
            <label class="form-check-label">Multiplicación</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="operacion" value="division">
            <label class="form-check-label">División</label>
        </div>
    </div>

    <button type="submit" class="btn btn-primary">Calcular</button>
</form>

<h1>
    La sum de {{ n1 }} + {{ n2 }} = {{"%.2" .format(res)}}
</h1>
 
{% endblock %}
