<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="{{ url_for('static', filename='bootstrap-5.0.2-dist/css/bootstrap.min.css') }}" rel="stylesheet">
    <title>IDGS-802</title>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">IDGS-802</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}"
                       href="{{ url_for('index') }}">Inicio</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'formulario' %}active{% endif %}"
                       href="{{ url_for('formulario') }}">Formularios</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'reportes' %}active{% endif %}"
                       href="{{ url_for('reportes') }}">Reportes</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'operas1' %}active{% endif %}"
                       href="{{ url_for('operas1') }}">OperaBas</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'cinepolis' %}active{% endif %}"
                       href="{{ url_for('cinepolis') }}">Cinépolis</a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5 pt-4">

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}
    {% endblock %}

</div>

<script src="{{ url_for('static', filename='bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
